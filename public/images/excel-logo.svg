<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48" aria-hidden="true" role="img">
  <!-- Optimized Excel-like logo: green tile + white X + grid -->
  <rect x="1" y="6" width="38" height="50" rx="2" fill="#0b6b3a"/>
  <rect x="22" y="6" width="40" height="50" rx="4" fill="#0f5d33"/>

  <!-- white X on left tile -->
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M10 18 L18 32 L10 46" />
    <path d="M18 18 L10 32 L18 46" />
  </g>

  <!-- grid lines on right tile -->
  <g fill="#fff">
    <rect x="30" y="14" width="18" height="4" rx="1" />
    <rect x="30" y="22" width="18" height="4" rx="1" />
    <rect x="30" y="30" width="18" height="4" rx="1" />
    <rect x="30" y="38" width="18" height="4" rx="1" />
    <rect x="30" y="46" width="18" height="4" rx="1" />
  </g>
</svg>
